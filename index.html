<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-Dare 口袋營養獅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f1f42;
    --navy2: #1a3260;
    --blue: #2d5aab;
    --blue2: #4a7fd4;
    --light-blue: #a8c4e8;
    --sky: #ddeeff;
    --cream: #f0f5ff;
    --warm-white: #f8fbff;
    --gold: #c9a84c;
    --text: #1a2744;
    --text-light: #5a6a85;
    --tag-bg: #e0eaf8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #f0f5ff;
    color: var(--text);
    overflow-x: hidden;
  }

  /* -- HERO -- */
  .hero {
    background: linear-gradient(145deg, #0a1628 0%, #0f1f42 40%, #1a3260 70%, #1e3d6e 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 60px 24px;
  }
  .hero-blob1 {
    position: absolute; border-radius: 50%; pointer-events: none;
    width: 500px; height: 500px; top: -100px; right: -100px;
    background: radial-gradient(circle, rgba(74,127,212,0.25) 0%, transparent 70%);
    animation: blobFloat 8s ease-in-out infinite;
  }
  .hero-blob2 {
    position: absolute; border-radius: 50%; pointer-events: none;
    width: 400px; height: 400px; bottom: -80px; left: -80px;
    background: radial-gradient(circle, rgba(45,90,171,0.3) 0%, transparent 70%);
    animation: blobFloat 10s ease-in-out infinite reverse;
  }
  .hero-blob3 {
    position: absolute; border-radius: 50%; pointer-events: none;
    width: 200px; height: 200px; top: 30%; left: 10%;
    background: radial-gradient(circle, rgba(168,196,232,0.12) 0%, transparent 70%);
    animation: blobFloat 12s ease-in-out infinite 2s;
  }
  @keyframes blobFloat {
    0%, 100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(20px,-15px) scale(1.05); }
    66% { transform: translate(-10px,20px) scale(0.95); }
  }

  .hero-badge {
    background: rgba(184,203,232,0.15);
    border: 1px solid rgba(184,203,232,0.3);
    color: var(--light-blue);
    font-size: 13px;
    letter-spacing: 3px;
    padding: 8px 20px;
    border-radius: 40px;
    margin-bottom: 32px;
    animation: fadeUp 0.8s ease both;
  }

  .hero h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(48px, 9vw, 96px);
    color: #fff;
    text-align: center;
    line-height: 1.25;
    margin-bottom: 12px;
    animation: fadeUp 0.8s 0.1s ease both;
    letter-spacing: -1px;
  }

  .hero h1 span {
    color: var(--light-blue);
  }

  .hero-sub {
    color: rgba(255,255,255,0.55);
    font-size: 16px;
    letter-spacing: 2px;
    margin-bottom: 48px;
    animation: fadeUp 0.8s 0.3s ease both;
  }

  .hero-cta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 0.8s 0.4s ease both;
  }

  .btn-primary {
    background: #06C755;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 16px 36px;
    border-radius: 50px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(6,199,85,0.45); }
  .line-icon { width: 22px; height: 22px; flex-shrink: 0; }

  .btn-line-hero {
    background: #06C755;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 32px;
    border-radius: 50px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    letter-spacing: 0.5px;
    transition: transform 0.2s, box-shadow 0.2s;
    line-height: 1;
  }
  .btn-line-hero:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(6,199,85,0.45); }

  .btn-secondary {
    background: transparent;
    color: rgba(255,255,255,0.8);
    font-size: 15px;
    padding: 16px 36px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.25);
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.5); }

  .hero-scroll {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    letter-spacing: 2px;
    animation: fadeUp 1s 0.8s ease both;
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
    animation: scrollPulse 2s infinite;
  }

  /* -- NAV -- */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,22,40,0.97);
    backdrop-filter: blur(12px);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .nav-logo {
    color: #fff;
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .nav-tabs {
    display: flex;
    gap: 4px;
  }

  .nav-tab {
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    background: transparent;
    font-family: 'Noto Sans TC', sans-serif;
  }

  .nav-tab:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .nav-tab.active { color: #fff; background: rgba(184,203,232,0.2); }

  /* -- SECTIONS -- */
  .section {
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .section.active { display: block; }

  /* -- TEAM SECTION -- */
  .team-header {
    background: linear-gradient(160deg, #e8f2ff 0%, #d0e4ff 50%, #e8f0ff 100%);
    padding: 80px 24px 80px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .team-header::before {
    content: '';
    position: absolute; top: -60px; right: -60px;
    width: 300px; height: 300px; border-radius: 50%;
    background: rgba(74,127,212,0.1);
  }
  .team-header::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: var(--warm-white);
    clip-path: ellipse(55% 100% at 50% 100%);
  }

  .section-label {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--blue);
    font-size: 12px;
    letter-spacing: 3px;
    padding: 6px 16px;
    border-radius: 40px;
    margin-bottom: 20px;
    font-weight: 500;
  }

  .section-title {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(28px, 4vw, 44px);
    color: var(--navy);
    line-height: 1.4;
    margin-bottom: 16px;
  }

  .section-desc {
    color: var(--text-light);
    font-size: 15px;
    line-height: 1.8;
    max-width: 560px;
    margin: 0 auto;
  }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 32px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 24px;
  }

  .team-card {
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(26,39,68,0.07);
    transition: transform 0.3s, box-shadow 0.3s;
    border: 1px solid rgba(26,39,68,0.06);
  }
  .team-card:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(26,39,68,0.12); }

  .card-top {
    background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
    padding: 32px 24px 24px;
    position: relative;
    overflow: hidden;
  }

  .card-top::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }

  .card-avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
    margin-bottom: 16px;
    object-fit: cover;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  .card-name {
    color: #fff;
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .card-title-en {
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .card-tag {
    background: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.9);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .card-body {
    padding: 24px;
  }

  .card-section-title {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--blue);
    font-weight: 600;
    margin-bottom: 10px;
    margin-top: 16px;
  }
  .card-section-title:first-child { margin-top: 0; }

  .card-list {
    list-style: none;
  }

  .card-list li {
    font-size: 13px;
    color: var(--text-light);
    padding: 4px 0;
    padding-left: 14px;
    position: relative;
    line-height: 1.6;
  }

  .card-list li::before {
    content: '·';
    position: absolute;
    left: 0;
    color: var(--blue);
    font-weight: bold;
  }

  /* -- KNOWLEDGE SECTION -- */
  .knowledge-header {
    background: linear-gradient(135deg, #0a1628 0%, #1a3260 60%, #2d5aab 100%);
    padding: 80px 24px 60px;
    text-align: center;
  }

  .knowledge-header .section-label {
    background: rgba(184,203,232,0.15);
    color: var(--light-blue);
  }

  .knowledge-header .section-title { color: #fff; }
  .knowledge-header .section-desc { color: rgba(255,255,255,0.5); }

  .articles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 24px;
  }

  .article-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(26,39,68,0.08);
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
  }
  .article-card:hover { transform: translateY(-4px); box-shadow: 0 10px 32px rgba(26,39,68,0.1); }

  .article-img {
    width: 100%;
    height: 160px;
    background: linear-gradient(135deg, var(--navy), var(--blue));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    position: relative;
    overflow: hidden;
  }

  .article-img::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.3));
  }

  .article-body {
    padding: 20px;
  }

  .article-cat {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--blue);
    font-size: 11px;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
    font-weight: 500;
  }

  .article-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 17px;
    color: var(--navy);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .article-excerpt {
    font-size: 13px;
    color: var(--text-light);
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(26,39,68,0.06);
  }

  .article-author {
    font-size: 12px;
    color: var(--text-light);
  }

  .article-read {
    font-size: 12px;
    color: var(--blue);
    font-weight: 500;
  }

  /* -- ARTICLE MODAL -- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,39,68,0.6);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 20px;
    max-width: 680px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    animation: modalIn 0.3s ease;
  }

  .modal-close {
    position: sticky;
    top: 16px;
    float: right;
    margin: 16px 16px 0 0;
    width: 36px; height: 36px;
    background: var(--cream);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    z-index: 10;
    transition: background 0.2s;
  }
  .modal-close:hover { background: var(--light-blue); }

  .modal-content { padding: 48px 40px 40px; }
  .modal-cat { display: inline-block; background: var(--tag-bg); color: var(--blue); font-size: 11px; letter-spacing: 1px; padding: 4px 10px; border-radius: 20px; margin-bottom: 16px; }
  .modal-title { font-family: 'Noto Serif TC', serif; font-size: 26px; color: var(--navy); line-height: 1.4; margin-bottom: 20px; }
  .modal-meta { font-size: 13px; color: var(--text-light); margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--cream); }
  .modal-body { font-size: 15px; line-height: 1.9; color: var(--text); }
  .modal-body p { margin-bottom: 16px; }
  .modal-body h3 { font-family: 'Noto Serif TC', serif; color: var(--navy); font-size: 18px; margin: 24px 0 10px; }

  /* -- SEO ARTICLE STYLES -- */
  .modal-body h2 { font-family: 'Noto Serif TC', serif; color: var(--navy); font-size: 20px; margin: 28px 0 10px; padding-bottom: 8px; border-bottom: 2px solid var(--cream); }
  .modal-body ul, .modal-body ol { padding-left: 20px; margin-bottom: 14px; }
  .modal-body li { margin-bottom: 6px; line-height: 1.8; }
  .modal-body .seo-summary { background: var(--cream); border-left: 4px solid var(--blue); padding: 16px 20px; border-radius: 0 10px 10px 0; margin-bottom: 24px; font-size: 14px; color: var(--text-light); line-height: 1.8; }
  .modal-body .seo-highlight { background: #fffbf0; border: 1px solid rgba(201,168,76,0.3); padding: 14px 18px; border-radius: 10px; margin: 16px 0; font-size: 14px; }
  .modal-body .seo-author { display: flex; align-items: center; gap: 10px; background: var(--cream); padding: 14px 18px; border-radius: 10px; margin-top: 28px; font-size: 13px; color: var(--text-light); }

  /* -- ABOUT HIGHLIGHTS -- */
  .about-highlights {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 24px 40px;
    position: relative;
  }

  .highlight-card {
    background: linear-gradient(135deg, #fff 0%, #f5f9ff 100%);
    border-radius: 20px;
    padding: 28px 24px;
    border: 1.5px solid rgba(74,127,212,0.15);
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
  }
  .highlight-card::before {
    content: '';
    position: absolute; top: -20px; right: -20px;
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(74,127,212,0.06);
  }
  .highlight-card:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(45,90,171,0.15); border-color: rgba(74,127,212,0.35); }

  .highlight-icon { font-size: 36px; margin-bottom: 14px; }
  .highlight-title { font-family: 'Noto Serif TC', serif; font-size: 16px; color: var(--navy); font-weight: 700; margin-bottom: 10px; }
  .highlight-desc { font-size: 13px; color: var(--text-light); line-height: 1.8; }

  /* -- EXPERTISE -- */
  .expertise-section {
    background: linear-gradient(135deg, #0f1f42 0%, #1a3260 50%, #2d5aab 100%);
    padding: 70px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .expertise-section::before {
    content: '';
    position: absolute; top: -80px; left: -80px;
    width: 350px; height: 350px; border-radius: 50%;
    background: rgba(74,127,212,0.15);
  }
  .expertise-section::after {
    content: '';
    position: absolute; bottom: -60px; right: -60px;
    width: 280px; height: 280px; border-radius: 50%;
    background: rgba(168,196,232,0.1);
  }

  .expertise-inner { max-width: 800px; margin: 0 auto; }
  .expertise-title { font-family: 'Noto Serif TC', serif; font-size: 26px; color: #fff; margin-bottom: 28px; }

  .expertise-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .exp-tag {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 10px 22px;
    border-radius: 40px;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    backdrop-filter: blur(4px);
  }
  .exp-tag:hover { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); transform: translateY(-2px); }

  /* -- FEATURES -- */
  .features-section {
    background: linear-gradient(170deg, #f0f5ff 0%, #e0ecff 40%, #d5e7ff 100%);
    padding: 80px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .features-section::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 60px;
    background: linear-gradient(135deg, #0f1f42 0%, #1a3260 50%, #2d5aab 100%);
    clip-path: ellipse(55% 100% at 50% 0%);
  }
  .features-section::after {
    content: '';
    position: absolute; top: -40px; right: 5%;
    width: 200px; height: 200px; border-radius: 50%;
    background: rgba(74,127,212,0.08);
  }

  .features-inner { max-width: 900px; margin: 0 auto; }
  .features-title { font-family: 'Noto Serif TC', serif; font-size: 26px; color: var(--navy); margin-bottom: 40px; }

  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    text-align: left;
  }

  .feature-item {
    background: rgba(255,255,255,0.85);
    border: 1.5px solid rgba(74,127,212,0.12);
    border-radius: 16px;
    padding: 22px 20px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }
  .feature-item:hover { background: #fff; border-color: rgba(74,127,212,0.3); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(45,90,171,0.1); }

  .feature-num {
    font-family: 'Noto Serif TC', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--blue2);
    opacity: 0.6;
    flex-shrink: 0;
    line-height: 1;
    margin-top: 2px;
  }

  .feature-text strong {
    display: block;
    color: var(--navy);
    font-size: 15px;
    margin-bottom: 6px;
  }

  .feature-text span {
    color: var(--text-light);
    font-size: 13px;
    line-height: 1.7;
  }

  /* -- PLANS -- */
  .plans-section {
    padding: 80px 24px 80px;
    text-align: center;
    background: linear-gradient(180deg, #0f1f42 0%, #1a3260 60%, #0f1f42 100%);
    position: relative;
    overflow: hidden;
  }
  .plans-section::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 70px;
    background: linear-gradient(170deg, #f0f5ff 0%, #e0ecff 100%);
    clip-path: ellipse(55% 100% at 50% 0%);
  }
  .plans-section::after {
    content: '';
    position: absolute; bottom: -80px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 300px; border-radius: 50%;
    background: rgba(74,127,212,0.08);
  }

  .plans-title { font-family: 'Noto Serif TC', serif; font-size: 28px; color: #fff; margin-bottom: 8px; }
  .plans-sub { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 40px; }

      content: "<div class=\"seo-summary\">📋 <strong>本文重點：</strong>說明為什麼少吃反而瘦不了、均衡飲食的三個關鍵要素，以及簡單好執行的餐盤法則。</div>\n<h2>為什麼少吃反而瘦不了？</h2>\n<p>這是許多人在減重過程中最常犯的錯誤。當熱量攝取過低時，身體會啟動「節能保護機制」，降低基礎代謝率。結果就是：你吃得越少，身體燃燒越慢，最終陷入「吃一點就胖」的惡性循環。</p>\n<p>更糟的是，極端節食往往會同時流失肌肉，讓你的體態變得鬆軟、體脂率反而更高。</p>\n<h2>聰明減脂的三大關鍵</h2>\n<h3>1. 攝取足夠的蛋白質</h3>\n<p>每公斤體重至少攝取 1.2～1.6g 蛋白質。蛋白質不僅幫助保留肌肉、促進代謝，飽足感也比碳水和脂肪更持久。</p>\n<ul>\n<li>雞胸肉（每 100g 約含 31g 蛋白質）</li>\n<li>雞蛋（每顆約含 6g 蛋白質）</li>\n<li>豆腐、毛豆等豆類</li>\n</ul>\n<h3>2. 不需要害怕碳水化合物</h3>\n<p>碳水是大腦和肌肉的主要燃料，完全戒除碳水反而會讓人容易疲憊、思緒不清。建議選擇原型澱粉，例如地瓜、糙米、燕麥，取代精緻白米或麵包。</p>\n<h3>3. 選對好的脂肪</h3>\n<p>酪梨、堅果、橄欖油所含的不飽和脂肪，能幫助脂溶性維生素吸收，也有助於維持飽足感，並不需要完全避開。</p>\n<h2>最簡單的執行工具：餐盤法則</h2>\n<div class=\"seo-highlight\">🍽️ <strong>餐盤比例：</strong>½ 蔬菜 ＋ ¼ 優質蛋白質 ＋ ¼ 原型澱粉<br>不需要計算每一卡路里，只要掌握這個比例，自然能控制熱量又吃得飽足。</div>\n<h2>結論</h2>\n<p>真正有效的減脂飲食，不是一味少吃，而是「吃對」。確保三大營養素均衡攝取，身體才有足夠的燃料代謝脂肪，讓你在不挨餓的狀態下，穩定且持續地達到目標。</p>\n<div class=\"seo-author\">✍️ 本文由 <strong>Co-Dare 口袋營養獅 · Sealion 亭瑄營養師</strong> 撰寫｜臺灣師範大學營養科學碩士</div>"

      content: "<div class=\"seo-summary\">📋 <strong>本文重點：</strong>增肌所需蛋白質份量計算、最佳攝取時機，以及台灣常見的優質蛋白質食物來源。</div>\n<h2>增肌需要多少蛋白質？</h2>\n<p>根據運動營養研究建議，增肌期每公斤體重每天應攝取 <strong>1.6～2.2g 蛋白質</strong>。以體重 60kg 的人為例，每天大約需要 96～132g，相當於 4～5 份雞胸肉的量。</p>\n<p>許多人以為自己吃了不少蛋白質，但實際計算後往往只達到建議量的一半。</p>\n<h2>蛋白質攝取時機一樣重要</h2>\n<h3>均勻分配三餐</h3>\n<p>研究顯示，將蛋白質均勻分配在三到四餐，比一次大量攝取的肌肉合成效率更高。建議每餐攝取 25～40g 蛋白質。</p>\n<h3>訓練後的黃金窗口</h3>\n<p>重訓結束後的 2 小時內，肌肉對蛋白質的吸收利用率最高。此時補充含有 20～40g 蛋白質的食物或飲品，能顯著提升肌肉合成效率。</p>\n<h2>台灣常見優質蛋白質食物</h2>\n<ul>\n<li>雞胸肉（100g / 31g 蛋白質）</li>\n<li>雞蛋（每顆 / 6g 蛋白質）</li>\n<li>板豆腐（100g / 8g 蛋白質）</li>\n<li>希臘優格（一杯 / 17g 蛋白質）</li>\n<li>鮭魚（100g / 25g 蛋白質）</li>\n</ul>\n<div class=\"seo-highlight\">🌱 <strong>植物性飲食者的選擇：</strong>大豆蛋白是完全蛋白質，含有所有必需胺基酸，可搭配毛豆、豆腐、豆漿多樣化攝取。</div>\n<h2>結論</h2>\n<p>增肌的成果不只靠訓練，飲食是同等重要的一塊。確認自己每天蛋白質攝取達標，並且善用訓練後的黃金時機補充，才能讓每一次的汗水真正轉化為肌肉。</p>\n<div class=\"seo-author\">✍️ 本文由 <strong>Co-Dare 口袋營養獅 · Trista 禹彤營養師</strong> 撰寫｜CTSSN 運動營養專業認證</div>"

      excerpt: '血糖、血脂、血壓偏高不代表什麼都不能吃。透過正確的飲食調整，許多人不需要藥物就能讓數值回到正常範圍。',

      content: "<div class=\"seo-summary\">📋 <strong>本文重點：</strong>分別針對高血糖、高血脂、高血壓提供具體的飲食調整策略，並說明實證最強的得舒飲食原則。</div>\n<h2>高血糖：穩定血糖波動是關鍵</h2>\n<p>血糖管理的核心不是「不吃澱粉」，而是「選對澱粉、搭配得當」，讓血糖緩慢上升、平穩下降，避免劇烈波動。</p>\n<h3>建議這樣吃</h3>\n<ul>\n<li>選擇低 GI 食物：燕麥、地瓜、全麥麵包取代白米飯、白吐司</li>\n<li>每餐先吃蔬菜再吃澱粉，可減緩血糖上升速度約 20%</li>\n<li>減少含糖飲料、甜食、精緻點心</li>\n</ul>\n<h2>高血脂：減少壞脂肪、增加好脂肪</h2>\n<p>血脂偏高的人，飲食重點在於調整脂肪的「種類」，而非完全不吃油。</p>\n<h3>需要減少的食物</h3>\n<ul>\n<li>飽和脂肪：肥肉、豬皮、全脂牛奶、奶油</li>\n<li>反式脂肪：酥皮麵包、油炸食品、某些餅乾</li>\n</ul>\n<h3>需要增加的食物</h3>\n<ul>\n<li>富含 Omega-3：鯖魚、秋刀魚、鮭魚，每週至少 2 次</li>\n<li>可溶性纖維：燕麥、蘋果、豆類，幫助降低 LDL 膽固醇</li>\n</ul>\n<h2>高血壓：得舒飲食（DASH Diet）</h2>\n<div class=\"seo-highlight\">💡 <strong>得舒飲食</strong>是目前實證效果最強的降壓飲食法，研究顯示可降低收縮壓約 8～14 mmHg。</div>\n<p>核心原則：多吃蔬果、選擇低脂乳品、以全穀取代精緻澱粉，每日鈉攝取控制在 2,300mg 以下（約一茶匙鹽）。</p>\n<h2>結論</h2>\n<p>三高的飲食調整不需要大幅改變生活型態，從幾個具體的食物替換開始，配合規律運動，許多人在 3～6 個月內就能看到明顯的數值改善。如果你不確定從哪裡開始，歡迎與我們的營養師預約個別諮詢。</p>\n<div class=\"seo-author\">✍️ 本文由 <strong>Co-Dare 口袋營養獅 · Samuel 勝崴營養師</strong> 撰寫｜醫學中心臨床營養師背景</div>"

      content: "<div class=\"seo-summary\">📋 <strong>本文重點：</strong>詳細說明台灣六大類食物的定義、每日建議份量，以及不需要秤重的簡易估算技巧。</div>\n<h2>什麼是什麼是六大類食物？</h2>\n<p>台灣衛福部將食物依據主要營養素分為六大類，每一類都有其獨特的功能，缺少任何一類都可能造成營養不均衡。</p>\n<h2>六大類食物逐一說明</h2>\n<h3>1. 全穀雜糧類（每日 1.5～4 碗）</h3>\n<p>提供碳水化合物、B 群及膳食纖維。建議以未精製的全穀類為主，例如糙米、燕麥、地瓜、玉米，取代白米和白麵。</p>\n<h3>2. 豆魚蛋肉類（每日 3～8 份）</h3>\n<p>蛋白質的主要來源。建議依序以豆製品、魚類、蛋、禽肉、紅肉為選擇優先順序，盡量減少加工肉品。</p>\n<h3>3. 乳品類（每日 1.5～2 杯）</h3>\n<p>補充鈣質的最佳來源，同時提供優質蛋白質。選擇低脂或脫脂乳品可減少飽和脂肪攝取。</p>\n<h3>4. 蔬菜類（每日 3～5 份）</h3>\n<p>富含維生素、礦物質及膳食纖維。顏色越豐富、種類越多元越好，深綠色蔬菜建議每天都要攝取。</p>\n<h3>5. 水果類（每日 2～4 份）</h3>\n<p>提供天然糖分、維生素 C 及抗氧化物質。選擇當季新鮮水果，避免以果汁取代整顆水果。</p>\n<h3>6. 油脂與堅果種子類（每日 3～7 茶匙油 + 1 份堅果）</h3>\n<p>提供必需脂肪酸和脂溶性維生素，幫助吸收。選擇橄欖油、苦茶油等植物油，每天一小把堅果（約 30g）。</p>\n<h2>不用秤重的份量估算技巧</h2>\n<div class=\"seo-highlight\">🖐️ <strong>手掌估算法：</strong><br>\n• 一份蛋白質 ≈ 手掌大小厚度<br>\n• 一份澱粉 ≈ 一個握拳大小<br>\n• 一份蔬菜 ≈ 煮熟後約半碗<br>\n• 一份水果 ≈ 一個拳頭大小</div>\n<h2>結論</h2>\n<p>均衡飲食不需要複雜的計算，從認識六大類食物開始，確保每天每一類都有攝取，就是建立健康飲食習慣的第一步。</p>\n<div class=\"seo-author\">✍️ 本文由 <strong>Co-Dare 口袋營養獅 · Nana 承芳營養師</strong> 撰寫｜腎臟專科營養師</div>"

// --- 渲染畫面 ---
function renderAll() {
  const p = defaultData.page;
  
  // 更新靜態文字
  document.getElementById('hero-title-el').innerHTML = p.heroTitle;
  document.getElementById('hero-sub-el').textContent = p.heroSub;
  document.getElementById('team-page-title').innerHTML = p.teamTitle;
  document.getElementById('team-page-desc').textContent = p.teamDesc;
  document.getElementById('footer-line-text').textContent = defaultData.footerText;
  
  // 更新連結
  document.querySelectorAll('#line-btn-hero, #line-btn-nav').forEach(el => el.href = defaultData.lineUrl);

  // 生成動態內容
  let dynamicHTML = '';

  // 1. 亮點區塊
  dynamicHTML += `<div class="about-highlights">`;
  p.highlights.forEach(h => {
    dynamicHTML += `<div class="highlight-card"><div class="highlight-icon">${h.icon}</div><div class="highlight-title">${h.title}</div><div class="highlight-desc">${h.desc}</div></div>`;
  });
  dynamicHTML += `</div>`;

  // 2. 團隊區塊
  dynamicHTML += `<div class="team-grid">`;
  defaultData.members.forEach(m => {
    dynamicHTML += `
      <div class="team-card">
        <div class="card-top">
          <div class="card-avatar">${m.emoji}</div>
          <div class="card-name">${m.name}</div>
          <div class="card-title-en">${m.fullName} · DIETITIAN</div>
          <div class="card-tags">${m.specialties.map(s => `<span class="card-tag">${s}</span>`).join('')}</div>
        </div>
        <div class="card-body">
          <div class="card-section-title">學歷</div>
          <ul class="card-list">${m.edu.map(e => `<li>${e}</li>`).join('')}</ul>
          <div class="card-section-title">經歷</div>
          <ul class="card-list">${m.exp.map(e => `<li>${e}</li>`).join('')}</ul>
          <div class="card-section-title">證照</div>
          <ul class="card-list">${m.certs.map(c => `<li>${c}</li>`).join('')}</ul>
        </div>
      </div>
    `;
  });
  dynamicHTML += `</div>`;

  // 3. 專長標籤
  dynamicHTML += `
    <div class="expertise-section">
      <div class="expertise-inner">
        <div class="section-label" style="margin-bottom:20px">EXPERTISE</div>
        <h3 class="expertise-title">我們擅長的領域</h3>
        <div class="expertise-tags">
          ${p.tags.map(t => `<span class="exp-tag">${t}</span>`).join('')}
        </div>
      </div>
    </div>`;

  // 4. 服務流程
  dynamicHTML += `
    <div class="features-section">
      <div class="features-inner">
        <div class="section-label" style="margin-bottom:20px;background:rgba(45,90,171,0.1);color:var(--blue)">HOW WE WORK</div>
        <h3 class="features-title">我們怎麼陪你改變</h3>
        <div class="features-grid">
          ${p.steps.map((s, i) => `
            <div class="feature-item">
              <div class="feature-num">0${i+1}</div>
              <div class="feature-text"><strong>${s.title}</strong><span>${s.desc}</span></div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;

  // 5. 課程方案
  dynamicHTML += `
    <div class="plans-section" id="pricing-section">
      <div class="section-label" style="margin-bottom:20px;background:rgba(255,255,255,0.15);color:#fff;">PRICING</div>
      <h3 class="plans-title">課程方案</h3>
      <p class="plans-sub">一期四週，每月訂閱制</p>
      <div class="plans-grid">
        ${p.plans.map((plan, i) => {
          let btnHTML = '';
          if (plan.isLineContact) {
            btnHTML = `
              <p style="font-size:13px;color:#6b6b6b;margin-bottom:8px;text-align:center;">加入 LINE 專人聯繫</p>

              <ul class="plan-list">${plan.items.map(it => `<li>✓ ${it}</li>`).join('')}</ul>
              ${btnHTML}
            </div>
          `;
        }).join('')}
      </div>
    </div>`;

  document.getElementById('team-dynamic-content').innerHTML = dynamicHTML;

  // 6. 渲染文章列表
  const articlesGrid = document.getElementById('articles-grid');
  articlesGrid.innerHTML = defaultData.articles.map((a, i) => `
    <div class="article-card" onclick="openArticle(${i})">
      <div class="article-img">${a.emoji}</div>
      <div class="article-body">
        <span class="article-cat">${a.category}</span>
        <h3 class="article-title">${a.title}</h3>
        <p class="article-excerpt">${a.excerpt}</p>
        <div class="article-footer">
          <span class="article-author">✍️ ${a.author}</span>
          <span class="article-read">${a.readTime || '閱讀全文'} →</span>
        </div>
      </div>
    </div>
  `).join('');
}

// --- 互動功能 ---
function switchSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('section-' + name).classList.add('active');
  const tabs = document.querySelectorAll('.nav-tab');
  if (name === 'team') tabs[0].classList.add('active');
  if (name === 'knowledge') tabs[1].classList.add('active');
}

function scrollToNav() {
  document.getElementById('main-nav').scrollIntoView({ behavior: 'smooth' });
}

function scrollToHero(e) {
  e.preventDefault();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openArticle(i) {
  const a = defaultData.articles[i];
  document.getElementById('modal-cat').textContent = a.category;
  document.getElementById('modal-title').textContent = a.title;
  document.getElementById('modal-meta').innerHTML = `✍️ ${a.author}${a.date ? ' &nbsp;·&nbsp; 📅 ' + a.date : ''}${a.readTime ? ' &nbsp;·&nbsp; ⏱ ' + a.readTime : ''}`;
  document.getElementById('modal-body').innerHTML = a.content;
  document.getElementById('article-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('article-modal').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('article-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// 初始化渲染
renderAll();
</script>
