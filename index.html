<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-Dare 口袋營養獅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f1f42;
    --navy2: #1a3260;
    --blue: #2d5aab;
    --blue2: #4a7fd4;
    --light-blue: #a8c4e8;
    --sky: #ddeeff;
    --cream: #f0f5ff;
    --warm-white: #f8fbff;
    --gold: #c9a84c;
    --text: #1a2744;
    --text-light: #5a6a85;
    --tag-bg: #e0eaf8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #f0f5ff;
    color: var(--text);
    overflow-x: hidden;
  }

  /* -- HERO -- */
  .hero {
    background: linear-gradient(145deg, #0a1628 0%, #0f1f42 40%, #1a3260 70%, #1e3d6e 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 60px 24px;
  }
  .hero-blob1 {
    position: absolute; border-radius: 50%; pointer-events: none;
    width: 500px; height: 500px; top: -100px; right: -100px;
    background: radial-gradient(circle, rgba(74,127,212,0.25) 0%, transparent 70%);
    animation: blobFloat 8s ease-in-out infinite;
  }
  .hero-blob2 {
    position: absolute; border-radius: 50%; pointer-events: none;
    width: 400px; height: 400px; bottom: -80px; left: -80px;
    background: radial-gradient(circle, rgba(45,90,171,0.3) 0%, transparent 70%);
    animation: blobFloat 10s ease-in-out infinite reverse;
  }
  .hero-blob3 {
    position: absolute; border-radius: 50%; pointer-events: none;
    width: 200px; height: 200px; top: 30%; left: 10%;
    background: radial-gradient(circle, rgba(168,196,232,0.12) 0%, transparent 70%);
    animation: blobFloat 12s ease-in-out infinite 2s;
  }
  @keyframes blobFloat {
    0%, 100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(20px,-15px) scale(1.05); }
    66% { transform: translate(-10px,20px) scale(0.95); }
  }



  .hero-badge {
    background: rgba(184,203,232,0.15);
    border: 1px solid rgba(184,203,232,0.3);
    color: var(--light-blue);
    font-size: 13px;
    letter-spacing: 3px;
    padding: 8px 20px;
    border-radius: 40px;
    margin-bottom: 32px;
    animation: fadeUp 0.8s ease both;
  }

  .hero h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(48px, 9vw, 96px);
    color: #fff;
    text-align: center;
    line-height: 1.25;
    margin-bottom: 12px;
    animation: fadeUp 0.8s 0.1s ease both;
    letter-spacing: -1px;
  }

  .hero h1 span {
    color: var(--light-blue);
  }

  .hero-sub {
    color: rgba(255,255,255,0.55);
    font-size: 16px;
    letter-spacing: 2px;
    margin-bottom: 48px;
    animation: fadeUp 0.8s 0.3s ease both;
  }

  .hero-cta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 0.8s 0.4s ease both;
  }

  .btn-primary {
    background: #06C755;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 16px 36px;
    border-radius: 50px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(6,199,85,0.45); }
  .line-icon { width: 22px; height: 22px; flex-shrink: 0; }

  .btn-line-hero {
    background: #06C755;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 32px;
    border-radius: 50px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    letter-spacing: 0.5px;
    transition: transform 0.2s, box-shadow 0.2s;
    line-height: 1;
  }
  .btn-line-hero:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(6,199,85,0.45); }

  .btn-secondary {
    background: transparent;
    color: rgba(255,255,255,0.8);
    font-size: 15px;
    padding: 16px 36px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.25);
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.5); }

  .hero-scroll {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    letter-spacing: 2px;
    animation: fadeUp 1s 0.8s ease both;
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
    animation: scrollPulse 2s infinite;
  }

  /* -- NAV -- */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,22,40,0.97);
    backdrop-filter: blur(12px);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .nav-logo {
    color: #fff;
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .nav-tabs {
    display: flex;
    gap: 4px;
  }

  .nav-tab {
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    background: transparent;
    font-family: 'Noto Sans TC', sans-serif;
  }

  .nav-tab:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .nav-tab.active { color: #fff; background: rgba(184,203,232,0.2); }

  .nav-cta {
    background: #06C755;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.2s;
    letter-spacing: 0.5px;
  }
  .nav-cta:hover { opacity: 0.85; }

  /* -- SECTIONS -- */
  .section {
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .section.active { display: block; }

  /* -- TEAM SECTION -- */
  .team-header {
    background: linear-gradient(160deg, #e8f2ff 0%, #d0e4ff 50%, #e8f0ff 100%);
    padding: 80px 24px 80px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .team-header::before {
    content: '';
    position: absolute; top: -60px; right: -60px;
    width: 300px; height: 300px; border-radius: 50%;
    background: rgba(74,127,212,0.1);
  }
  .team-header::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: var(--warm-white);
    clip-path: ellipse(55% 100% at 50% 100%);
  }

  .section-label {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--blue);
    font-size: 12px;
    letter-spacing: 3px;
    padding: 6px 16px;
    border-radius: 40px;
    margin-bottom: 20px;
    font-weight: 500;
  }

  .section-title {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(28px, 4vw, 44px);
    color: var(--navy);
    line-height: 1.4;
    margin-bottom: 16px;
  }

  .section-desc {
    color: var(--text-light);
    font-size: 15px;
    line-height: 1.8;
    max-width: 560px;
    margin: 0 auto;
  }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 32px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 24px;
  }

  .team-card {
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(26,39,68,0.07);
    transition: transform 0.3s, box-shadow 0.3s;
    border: 1px solid rgba(26,39,68,0.06);
  }
  .team-card:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(26,39,68,0.12); }

  .card-top {
    background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
    padding: 32px 24px 24px;
    position: relative;
    overflow: hidden;
  }

  .card-top::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }

  .card-avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
    margin-bottom: 16px;
    object-fit: cover;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  .card-name {
    color: #fff;
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .card-title-en {
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .card-tag {
    background: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.9);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .card-body {
    padding: 24px;
  }

  .card-section-title {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--blue);
    font-weight: 600;
    margin-bottom: 10px;
    margin-top: 16px;
  }
  .card-section-title:first-child { margin-top: 0; }

  .card-list {
    list-style: none;
  }

  .card-list li {
    font-size: 13px;
    color: var(--text-light);
    padding: 4px 0;
    padding-left: 14px;
    position: relative;
    line-height: 1.6;
  }

  .card-list li::before {
    content: '·';
    position: absolute;
    left: 0;
    color: var(--blue);
    font-weight: bold;
  }

  /* -- KNOWLEDGE SECTION -- */
  .knowledge-header {
    background: linear-gradient(135deg, #0a1628 0%, #1a3260 60%, #2d5aab 100%);
    padding: 80px 24px 60px;
    text-align: center;
  }

  .knowledge-header .section-label {
    background: rgba(184,203,232,0.15);
    color: var(--light-blue);
  }

  .knowledge-header .section-title { color: #fff; }
  .knowledge-header .section-desc { color: rgba(255,255,255,0.5); }

  .articles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 24px;
  }

  .article-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(26,39,68,0.08);
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
  }
  .article-card:hover { transform: translateY(-4px); box-shadow: 0 10px 32px rgba(26,39,68,0.1); }

  .article-img {
    width: 100%;
    height: 160px;
    background: linear-gradient(135deg, var(--navy), var(--blue));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    position: relative;
    overflow: hidden;
  }

  .article-img::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.3));
  }

  .article-body {
    padding: 20px;
  }

  .article-cat {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--blue);
    font-size: 11px;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
    font-weight: 500;
  }

  .article-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 17px;
    color: var(--navy);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .article-excerpt {
    font-size: 13px;
    color: var(--text-light);
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(26,39,68,0.06);
  }

  .article-author {
    font-size: 12px;
    color: var(--text-light);
  }

  .article-read {
    font-size: 12px;
    color: var(--blue);
    font-weight: 500;
  }

  /* -- ARTICLE MODAL -- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,39,68,0.6);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 20px;
    max-width: 680px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    animation: modalIn 0.3s ease;
  }

  .modal-close {
    position: sticky;
    top: 16px;
    float: right;
    margin: 16px 16px 0 0;
    width: 36px; height: 36px;
    background: var(--cream);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    z-index: 10;
    transition: background 0.2s;
  }
  .modal-close:hover { background: var(--light-blue); }

  .modal-content { padding: 48px 40px 40px; }
  .modal-cat { display: inline-block; background: var(--tag-bg); color: var(--blue); font-size: 11px; letter-spacing: 1px; padding: 4px 10px; border-radius: 20px; margin-bottom: 16px; }
  .modal-title { font-family: 'Noto Serif TC', serif; font-size: 26px; color: var(--navy); line-height: 1.4; margin-bottom: 20px; }
  .modal-meta { font-size: 13px; color: var(--text-light); margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--cream); }
  .modal-body { font-size: 15px; line-height: 1.9; color: var(--text); }
  .modal-body p { margin-bottom: 16px; }
  .modal-body h3 { font-family: 'Noto Serif TC', serif; color: var(--navy); font-size: 18px; margin: 24px 0 10px; }

  /* -- ADMIN PANEL -- */
  .admin-btn {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 12px 22px;
    font-size: 13px;
    cursor: pointer;
    z-index: 150;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(26,39,68,0.25);
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: 'Noto Sans TC', sans-serif;
  }
  .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(26,39,68,0.3); }

  .admin-panel {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(26,39,68,0.7);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .admin-panel.open { display: flex; }

  .admin-box {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 760px;
    max-height: 88vh;
    overflow-y: auto;
    animation: modalIn 0.3s ease;
  }

  .admin-header {
    background: var(--navy);
    padding: 20px 28px;
    border-radius: 20px 20px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .admin-header h2 {
    color: #fff;
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
  }

  .admin-header-close {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .admin-header-close:hover { background: rgba(255,255,255,0.25); }

  .admin-body { padding: 32px; }

  .admin-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    background: var(--cream);
    padding: 6px;
    border-radius: 12px;
  }

  .admin-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-light);
    transition: all 0.2s;
    font-family: 'Noto Sans TC', sans-serif;
  }
  .admin-tab.active { background: #fff; color: var(--navy); font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  .admin-section { display: none; }
  .admin-section.active { display: block; }

  .admin-field { margin-bottom: 20px; }
  .admin-label { font-size: 12px; font-weight: 600; color: var(--navy); letter-spacing: 1px; margin-bottom: 6px; display: block; }
  .admin-input, .admin-textarea, .admin-select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid rgba(26,39,68,0.12);
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text);
    transition: border-color 0.2s;
    background: #fff;
  }
  .admin-input:focus, .admin-textarea:focus, .admin-select:focus {
    outline: none;
    border-color: var(--blue);
  }
  .admin-textarea { resize: vertical; min-height: 100px; line-height: 1.6; }

  .admin-card-list { margin-bottom: 20px; }

  .admin-member-item {
    border: 1.5px solid rgba(26,39,68,0.1);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .admin-member-item:hover { border-color: var(--blue); background: var(--cream); }
  .admin-member-item.editing { border-color: var(--blue); background: #f0f4fb; }

  .admin-member-info { display: flex; align-items: center; gap: 12px; }
  .admin-member-emoji { font-size: 24px; }
  .admin-member-name { font-weight: 600; color: var(--navy); font-size: 15px; }
  .admin-member-sub { font-size: 12px; color: var(--text-light); }

  .admin-member-edit { display: none; padding: 16px 0 0; }
  .admin-member-edit.open { display: block; }

  .admin-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .admin-article-item {
    border: 1.5px solid rgba(26,39,68,0.1);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .admin-article-item:hover { border-color: var(--blue); }
  .admin-article-item.editing { border-color: var(--blue); background: #f0f4fb; }

  .article-item-icon { font-size: 28px; flex-shrink: 0; }
  .article-item-info { flex: 1; min-width: 0; }
  .article-item-title { font-weight: 600; color: var(--navy); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .article-item-sub { font-size: 12px; color: var(--text-light); margin-top: 2px; }

  .admin-article-edit { display: none; padding: 16px 0 0; }
  .admin-article-edit.open { display: block; }

  .btn-add {
    width: 100%;
    padding: 12px;
    border: 2px dashed rgba(59,95,160,0.3);
    background: transparent;
    border-radius: 10px;
    color: var(--blue);
    font-size: 14px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
    margin-bottom: 20px;
  }
  .btn-add:hover { border-color: var(--blue); background: var(--tag-bg); }

  .pg-section-header {
    background: var(--navy);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 10px 16px;
    border-radius: 8px;
    margin: 24px 0 14px;
    font-family: 'Noto Sans TC', sans-serif;
  }

  .btn-save {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 14px 32px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
